   - name: Build APK
        run: |
          # 创建 Cordova 必需的 www 文件夹并复制网页文件
          mkdir www
          cp index.html www/
          cp -r icon-192.png icon-512.png www/ 2>/dev/null || true
          
          # 初始化当前目录为 Cordova 项目（绑定已有的 config.xml）
          cordova create . --link-to config.xml
          
          # 添加平台和插件并构建
          cordova platform add android --no-telemetry
          cordova plugin add ./plugin_src
          cordova build android --release
