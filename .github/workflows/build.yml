name: Protected production APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Require existing long-lived signing identity
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/signing-config.cjs
      - run: npm install --ignore-scripts
      - run: npm test
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: |
          node scripts/prepare.cjs
          npx cordova platform add android@13.0.0 --no-telemetry
          npx cordova plugin add ./plugin_src
          npx cordova build android --release --buildConfig=build.json -- --packageType=apk
      - run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs platforms/android/app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: shiguangju-production-apk
          path: platforms/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing files
        if: always()
        run: node -e "for(const f of ['release-key.jks','build.json'])require('fs').rmSync(f,{force:true})"
