name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Cordova (global)
        run: npm install -g cordova@latest
      - name: Show versions
        run: node -v && npm -v && cordova -v
      - name: Add Android platform (verbose)
        run: cordova platform add android --verbose || (echo "--- platform add failed, diagnostics ---" && cordova platform list && cat /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/config.xml)
      - name: Add FloatingWindow plugin (local, verbose)
        run: cordova plugin add ./plugin_src --verbose || (echo "--- plugin add failed ---" && cordova plugin list)
      - name: Build APK (verbose)
        run: cordova build android --debug --verbose
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shiguangju-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
