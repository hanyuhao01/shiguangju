name: "Build Android APK"
"on":
  workflow_dispatch:
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Cordova
        run: npm install -g cordova
      - name: Build APK
        run: |
          rm -rf www
          mkdir www
          cp index.html www/
          cp -r icon-192.png icon-512.png www/ 2>/dev/null || true
          
          # 锁定兼容的 Android 平台版本
          cordova platform add android@13.0.0 --no-telemetry
          cordova plugin add ./plugin_src
          
          # 全局查找并彻底重写报错的悬浮窗插件源码 (修复 BOM 和 类结构错误)
          FILE=$(find platforms/android/app/src/main/java -name "FloatingWindowService.java" 2>/dev/null | head -n 1)
          if [ -n "$FILE" ]; then
            echo "Found and rewriting $FILE"
            cat > "$FILE" << 'EOF'
package com.shiguangju;

import android.app.Service;
import android.content.Intent;
import android.os.IBinder;
import android.view.WindowManager;
import android.view.Gravity;
import android.widget.TextView;

public class FloatingWindowService extends Service {
    private WindowManager windowManager;
    private TextView floatView;

    @Override
    public IBinder onBind(Intent intent) {
        return null;
    }

    @Override
    public void onCreate() {
        super.onCreate();
        windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
        floatView = new TextView(this);
        floatView.setText("悬浮窗");
        
        WindowManager.LayoutParams params = new WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
            android.graphics.PixelFormat.TRANSLUCENT
        );
        params.gravity = Gravity.TOP | Gravity.START;
        params.x = 0;
        params.y = 100;
        
        windowManager.addView(floatView, params);
    }

    @Override
    public void onDestroy() {
        super.onDestroy();
        if (floatView != null) {
            windowManager.removeView(floatView);
        }
    }
}
EOF
          else
            echo "FloatingWindowService.java not found, skipping rewrite."
          fi
          
          cordova build android --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiguangju-apk
          path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
