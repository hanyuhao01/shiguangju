name: "Build Android APK"
"on":
  workflow_dispatch:
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Cordova
        run: npm install -g cordova
      - name: Build APK
        run: |
          rm -rf www
          mkdir www
          cp index.html www/
          cp -r icon-192.png icon-512.png www/ 2>/dev/null || true
          
          # 强制使用兼容性更好的 Cordova Android 13 平台
          cordova platform add android@13.0.0 --no-telemetry
          cordova plugin add ./plugin_src
          
          # 自动修复悬浮窗插件的 Java 语法错误 (清理 BOM 和 修复大括号)
          FILE="platforms/android/app/src/main/java/com/lounai/cordova/floatingwindow/FloatingWindowService.java"
          if [ -f "$FILE" ]; then
            sed -i '1s/^\xef\xbb\xbf//' "$FILE"
            sed -i 's/^public class FloatingWindowService.*/public class FloatingWindowService extends Service {/' "$FILE"
            echo "Fixed FloatingWindowService.java"
          fi
          
          cordova build android --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiguangju-apk
          path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
