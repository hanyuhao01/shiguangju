<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-title" content="拾光橘">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>拾光橘</title>
<style>
/* ========== 设计令牌 ========== */
:root {
  --bg-base: #0a0e1a;
  --bg-layer1: #0f1428;
  --bg-layer2: #141a30;
  --panel-bg: rgba(20,25,48,0.78);
  --card-bg: rgba(30,38,66,0.6);
  --text-primary: #d8def0;
  --text-secondary: #8896b8;
  --text-muted: #5a6488;
  --accent-1: #64ffda;
  --accent-2: #4fc3f7;
  --accent-3: #b388ff;
  --accent-4: #f48fb1;
  --accent-5: #ffb74d;
  --accent-6: #81c784;
  --accent-7: #ef5350;
  --accent-8: #ce93d8;
  --shadow-hard: rgba(0,0,0,0.55);
  --shadow-soft: rgba(0,0,0,0.35);
  --shadow-glow: rgba(100,255,218,0.25);
  --glass-border: 1px solid rgba(255,255,255,0.07);
  --glass-highlight: 1px solid rgba(255,255,255,0.12);
  --title-color: #b0b8d6;
  --btn-text-shadow: 0 1px 3px rgba(0,0,0,0.55);
  --cat-bg-start: #2a3050;
  --cat-bg-end: #181e36;
  --cat-colors: #64ffda,#4fc3f7,#b388ff,#f48fb1,#ffb74d,#81c784,#ef5350,#ce93d8;
}

[data-theme="light"] {
  --bg-base: #f0ebe3;
  --bg-layer1: #ebe4d8;
  --bg-layer2: #e4dccd;
  --panel-bg: rgba(255,252,245,0.52);
  --card-bg: rgba(255,255,255,0.42);
  --text-primary: #2e2755;
  --text-secondary: #6a5f8a;
  --text-muted: #9a90b0;
  --accent-1: #00897b;
  --accent-2: #1976d2;
  --accent-3: #7c5cb5;
  --accent-4: #c2185b;
  --accent-5: #e8853d;
  --accent-6: #2e7d32;
  --accent-7: #c62828;
  --accent-8: #7b1fa2;
  --shadow-hard: rgba(100,80,55,0.5);
  --shadow-soft: rgba(120,100,75,0.3);
  --shadow-glow: rgba(0,137,123,0.2);
  --glass-border: 1px solid rgba(255,255,255,0.45);
  --glass-highlight: 1px solid rgba(255,255,255,0.65);
  --title-color: #2e2755;
  --btn-text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  --cat-bg-start: #5a8a5a;
  --cat-bg-end: #3a6a3a;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; min-height:100vh;
  background:var(--bg-base);
  color:var(--text-primary);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px; line-height:1.5;
  overflow-x:hidden;
  transition:background 0.4s ease;
}

[data-theme="light"] body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 12% 8%, rgba(255,175,80,0.28), transparent 72%),
    radial-gradient(ellipse 42% 38% at 88% 15%, rgba(255,110,150,0.18), transparent 72%),
    radial-gradient(ellipse 48% 42% at 50% 48%, rgba(90,170,255,0.14), transparent 72%),
    radial-gradient(ellipse 38% 32% at 78% 82%, rgba(60,200,140,0.12), transparent 72%),
    radial-gradient(ellipse 32% 28% at 18% 88%, rgba(190,140,255,0.14), transparent 72%);
  animation:driftBg 25s ease-in-out infinite alternate;
}
@keyframes driftBg { 0%{transform:scale(1) rotate(0deg)} 100%{transform:scale(1.06) rotate(2deg)} }

.theme-overlay {
  position:fixed; inset:0; z-index:9999; pointer-events:none;
  opacity:0; will-change:clip-path, opacity, filter;
}
.theme-overlay.sunrise {
  background:
    radial-gradient(ellipse 60% 50% at 0% 0%, rgba(255,235,190,0.95), transparent 65%),
    radial-gradient(ellipse 40% 35% at 8% 5%, rgba(255,210,140,0.55), transparent 70%),
    radial-gradient(ellipse 30% 25% at 18% 12%, rgba(255,190,100,0.30), transparent 72%),
    linear-gradient(135deg, rgba(255,230,180,0.18), rgba(255,210,150,0.06) 50%, transparent 80%);
  filter:blur(22px); opacity:1;
}
.theme-overlay.sunset {
  background:
    radial-gradient(ellipse 55% 45% at 0% 0%, rgba(30,35,60,0.55), transparent 65%),
    radial-gradient(ellipse 38% 32% at 10% 8%, rgba(20,25,50,0.35), transparent 70%),
    linear-gradient(135deg, rgba(15,18,35,0.30), rgba(15,18,35,0.10) 50%, transparent 80%);
  filter:blur(20px); opacity:1;
}

.app-container { position:relative; z-index:1; max-width:540px; margin:0 auto; padding:12px; padding-bottom:80px; }

.neu-btn {
  border:none; cursor:pointer; user-select:none;
  font-family:inherit; font-weight:700; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,0.5);
  box-shadow:6px 6px 14px rgba(0,0,0,0.65),-6px -6px 14px rgba(255,255,255,0.03),inset 2px 2px 4px rgba(255,255,255,0.08),inset -4px -4px 8px rgba(0,0,0,0.55);
  transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
}
.neu-btn:active { transform:scale(0.94); box-shadow:2px 2px 6px rgba(0,0,0,0.65),-2px -2px 6px rgba(255,255,255,0.02),inset 4px 4px 8px rgba(0,0,0,0.55); }
[data-theme="light"] .neu-btn { box-shadow:6px 6px 14px rgba(140,120,95,0.45),-6px -6px 14px rgba(255,255,255,0.75),inset 2px 2px 4px rgba(255,255,255,0.45),inset -4px -4px 8px rgba(120,100,75,0.30); }
[data-theme="light"] .neu-btn:active { box-shadow:2px 2px 6px rgba(120,100,75,0.5),-2px -2px 6px rgba(255,255,255,0.5),inset 4px 4px 8px rgba(120,100,75,0.35); }

.top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; margin-bottom:10px;
  background:var(--panel-bg); border-radius:16px;
  backdrop-filter:blur(22px) saturate(1.35); -webkit-backdrop-filter:blur(22px) saturate(1.35);
  border:var(--glass-border);
  box-shadow:6px 6px 14px rgba(0,0,0,0.4),-3px -3px 10px rgba(60,72,110,0.1);
}
.app-title { font-size:20px; font-weight:800; letter-spacing:1.5px; color:var(--title-color); }
.top-actions { display:flex; gap:8px; }
.icon-btn { width:42px; height:42px; border-radius:12px; font-size:18px; background:linear-gradient(180deg,#3a4060,#232a48); }
[data-theme="light"] .icon-btn { background:linear-gradient(180deg,#d4c5b3,#b8a890); color:var(--text-primary); }

.date-nav-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; margin-bottom:12px;
  background:var(--panel-bg); border-radius:14px;
  backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:var(--glass-border);
  box-shadow:6px 6px 14px rgba(0,0,0,0.4),-3px -3px 10px rgba(60,72,110,0.1);
}
.date-nav-left,.date-nav-right { display:flex; align-items:center; gap:6px; }
.date-nav-btn { width:36px; height:36px; border-radius:10px; font-size:16px; font-weight:700; background:linear-gradient(180deg,#3a4060,#232a48); }
[data-theme="light"] .date-nav-btn { background:linear-gradient(180deg,#d4c5b3,#b8a890); color:var(--text-primary); }
.date-display {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:pointer; user-select:none; padding:4px 10px; border-radius:10px;
  background:rgba(0,0,0,0.2);
  box-shadow:inset 3px 3px 8px rgba(0,0,0,0.45),inset -2px -2px 6px rgba(60,72,110,0.08);
}
[data-theme="light"] .date-display { background:rgba(255,255,255,0.4); box-shadow:inset 2px 2px 5px rgba(120,105,85,0.15),inset -1px -1px 3px rgba(255,255,255,0.5); }
.date-display:active { background:rgba(100,100,120,0.15); }
.date-year-month { font-size:15px; font-weight:700; color:var(--text-primary); }
.date-day { font-size:22px; font-weight:900; color:var(--accent-1); line-height:1.1; }
.date-weekday-scroll { display:flex; align-items:center; gap:4px; margin-top:2px; }
.weekday-item {
  width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer;
}
.weekday-item.active { background:var(--accent-1); color:#0a0e1a; font-weight:800; box-shadow:0 2px 6px rgba(100,255,218,0.35); }
.weekday-item:active { transform:scale(0.92); }
[data-theme="light"] .weekday-item.active { color:#fff; }

.date-picker-popup {
  display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:10002; padding:20px; border-radius:16px;
  background:var(--panel-bg); border:var(--glass-border);
  backdrop-filter:blur(24px) saturate(1.4); -webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 16px 48px rgba(0,0,0,0.45),6px 6px 14px rgba(0,0,0,0.4);
  min-width:290px;
}
[data-theme="light"] .date-picker-popup { background:rgba(255,252,245,0.92); border:1px solid rgba(255,255,255,0.7); box-shadow:0 16px 48px rgba(80,60,40,0.18),6px 6px 14px rgba(140,120,95,0.3); }
.date-picker-popup.show { display:block; animation:fadeInUp 0.25s ease; }
.date-picker-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.date-picker-header span { font-size:15px; font-weight:700; color:var(--text-primary); }
.date-picker-header button {
  width:34px; height:34px; border-radius:10px; border:none; cursor:pointer; font-size:15px; font-weight:700;
  background:linear-gradient(180deg,#3a4060,#232a48); color:var(--text-primary);
  box-shadow:4px 4px 10px rgba(0,0,0,0.5),-2px -2px 6px rgba(255,255,255,0.03),inset 1px 1px 3px rgba(255,255,255,0.06);
}
[data-theme="light"] .date-picker-header button { background:linear-gradient(180deg,#d4c5b3,#b8a890); box-shadow:4px 4px 10px rgba(120,100,75,0.35),-2px -2px 6px rgba(255,255,255,0.6),inset 1px 1px 3px rgba(255,255,255,0.4); }
.date-picker-header button:active { transform:translate(1px,2px) scale(0.94); }
.date-picker-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.date-picker-cell {
  width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer;
}
.date-picker-cell:hover { background:rgba(100,255,218,0.12); }
.date-picker-cell:active { transform:scale(0.92); background:rgba(100,255,218,0.2); }
.date-picker-cell.selected { background:var(--accent-1); color:#0a0e1a; font-weight:800; box-shadow:0 2px 8px rgba(100,255,218,0.4); }
[data-theme="light"] .date-picker-cell.selected { color:#fff; }
.date-picker-cell.today { border:2px solid var(--accent-2); }
.date-picker-cell.other-month { color:var(--text-muted); opacity:0.35; }
.date-picker-weekday-header { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px; }
.date-picker-weekday-header span { text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); }

.timer-card {
  position:relative; padding:20px 18px; margin-bottom:14px;
  background:var(--panel-bg); border-radius:20px;
  backdrop-filter:blur(26px) saturate(1.45); -webkit-backdrop-filter:blur(26px) saturate(1.45);
  border:var(--glass-border);
  box-shadow:8px 8px 20px rgba(0,0,0,0.4),-4px -4px 14px rgba(60,72,110,0.1),0 0 40px rgba(100,100,140,0.08);
}
[data-theme="light"] .timer-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0));
  border-radius:20px 20px 0 0; pointer-events:none; z-index:0;
}
.timer-card > * { position:relative; z-index:1; }

.progress-ring-container { position:relative; width:160px; height:160px; display:flex; align-items:center; justify-content:center; }
.timer-mascot-center {
  position:absolute; top:50%; left:50%; z-index:3;
  width:84px; height:84px; border-radius:50%; overflow:hidden;
  transform:translate(-50%,-50%);
  border:3px solid var(--accent-3); box-shadow:0 0 22px rgba(179,136,255,0.45),0 4px 14px rgba(0,0,0,0.3);
  cursor:pointer; background:var(--card-bg);
  display:flex; align-items:center; justify-content:center;
  font-size:38px;
  transition:transform 0.18s, box-shadow 0.18s;
}
.timer-mascot-center:active { transform:translate(-50%,-50%) scale(0.88); }
.timer-mascot-center img { width:100%; height:100%; object-fit:cover; }

.goal-display {
  text-align:center; font-size:13px; font-weight:600;
  color:var(--text-secondary); margin-top:6px; margin-bottom:4px;
  cursor:pointer; padding:4px 14px; border-radius:20px;
  background:var(--card-bg); border:1px dashed var(--text-muted);
  display:inline-block;
}
.goal-display:hover { color:var(--accent-1); border-color:var(--accent-1); }
[data-theme="light"] .goal-display { background:rgba(255,255,255,0.5); }

.timer-progress-wrap { display:flex; flex-direction:column; align-items:center; margin:8px 0 16px; gap:4px; }
.timer-progress-svg { width:160px; height:160px; transform:rotate(-90deg); }
.timer-progress-bg { fill:none; stroke:rgba(100,100,120,0.18); stroke-width:8; }
.timer-progress-fill {
  fill:none; stroke:url(#progressGrad); stroke-width:8; stroke-linecap:round;
  stroke-dasharray:377; stroke-dashoffset:377;
  transition:stroke-dashoffset 0.5s ease;
  filter:drop-shadow(0 0 6px var(--shadow-glow));
}

.timer-display {
  font-family:'Orbitron',monospace; font-size:52px; font-weight:900;
  text-align:center; letter-spacing:3px; margin:4px 0;
  color:var(--accent-1); text-shadow:0 0 16px var(--shadow-glow);
}
.timer-label { text-align:center; font-size:13px; color:var(--text-secondary); margin-bottom:14px; }

.timer-category-row { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.cat-btn-wrap { position:relative; display:inline-flex; }
[data-theme="dark"] .cat-btn { padding:7px 16px; border-radius:10px; font-size:13px; font-weight:600; color:var(--text-secondary); background:linear-gradient(180deg,#2a3050,#181e36); }
[data-theme="dark"] .cat-btn.active { color:var(--accent-1); box-shadow:0 0 0 2px var(--accent-1); }
[data-theme="light"] .cat-btn { padding:7px 16px; border-radius:10px; font-size:13px; font-weight:600; color:#fff; background:linear-gradient(180deg,var(--cat-bg-start),var(--cat-bg-end)); }
[data-theme="light"] .cat-btn.active { outline:2px solid var(--accent-1); }
.cat-btn-add { padding:7px 14px; border-radius:10px; border:2px dashed var(--text-muted); background:transparent; color:var(--text-secondary); cursor:pointer; font-size:16px; }
.cat-btn-del {
  position:absolute; top:-6px; right:-6px; width:18px; height:18px;
  border-radius:50%; background:var(--accent-7); color:#fff;
  font-size:12px; line-height:18px; text-align:center;
  cursor:pointer; z-index:2;
  display:none;
}
.cat-edit-mode .cat-btn-del { display:block; }

.timer-controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
.ctrl-btn { padding:13px 26px; border-radius:14px; font-size:16px; font-weight:700; color:#fff; }
[data-theme="dark"] .ctrl-btn-primary { background:linear-gradient(180deg,#43a047,#2e7d32); }
[data-theme="light"] .ctrl-btn-primary { background:linear-gradient(180deg,#4caf50,#388e3c); }
[data-theme="dark"] .ctrl-btn-secondary { padding:11px 20px; font-size:14px; background:linear-gradient(180deg,#ff8f00,#e65100); }
[data-theme="light"] .ctrl-btn-secondary { padding:11px 20px; font-size:14px; background:linear-gradient(180deg,#ff9800,#f57c00); }

.补录-panel {
  margin-top:14px; padding:16px; border-radius:14px; border:var(--glass-border);
  background:rgba(15,20,38,0.85);
  box-shadow:inset 4px 4px 10px rgba(0,0,0,0.5),inset -2px -2px 8px rgba(60,72,110,0.1);
}
[data-theme="light"] .补录-panel { background:rgba(255,255,255,0.45); }
.补录-panel h4 { font-size:14px; margin-bottom:12px; color:var(--text-primary); }
.补录-row { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.补录-label { font-size:13px; color:var(--text-secondary); min-width:48px; font-weight:600; }
.补录-select,.补录-input {
  flex:1; min-width:100px; padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.08);
  background:linear-gradient(180deg,#1c2340,#141a30); color:var(--text-primary); font-size:14px;
  box-shadow:inset 2px 2px 6px rgba(0,0,0,0.4); outline:none;
}
[data-theme="light"] .补录-select,[data-theme="light"] .补录-input { background:linear-gradient(180deg,#fff,#f5f0e8); border:1px solid rgba(0,0,0,0.08); color:var(--text-primary); }
.补录-select:focus,.补录-input:focus { box-shadow:0 0 0 2px var(--accent-1); }
.补录-btn { padding:11px 22px; border-radius:12px; font-size:14px; font-weight:700; color:#fff; background:linear-gradient(180deg,#5c8aff,#2a5fd0); }
[data-theme="light"] .补录-btn { background:linear-gradient(180deg,#4a7be0,#2e5fb5); }
.btn-补录-toggle { margin-top:12px; width:100%; padding:13px 26px; border-radius:14px; font-size:15px; font-weight:700; color:#fff; }
[data-theme="dark"] .btn-补录-toggle { background:linear-gradient(180deg,#5a6488,#3a4060); }
[data-theme="light"] .btn-补录-toggle { background:linear-gradient(180deg,#e8853d,#d46520); }

.scroll-time-picker {
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:rgba(10,14,28,0.6); border-radius:12px; padding:8px;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:inset 2px 2px 8px rgba(0,0,0,0.35);
}
[data-theme="light"] .scroll-time-picker { background:rgba(255,255,255,0.5); }
.scroll-wheel-col { display:flex; flex-direction:column; align-items:center; }
.scroll-wheel-label { font-size:11px; color:var(--text-secondary); }
.scroll-wheel {
  width:68px; height:96px; overflow:hidden; position:relative;
  border-radius:8px; background:rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.05);
  touch-action:none;
}
[data-theme="light"] .scroll-wheel { background:rgba(255,255,255,0.55); }
.scroll-wheel-track { position:absolute; top:0; left:0; width:100%; }
.scroll-wheel-item { height:32px; line-height:32px; text-align:center; font-size:16px; font-weight:600; color:var(--text-muted); }
.scroll-wheel-item.active { color:var(--accent-1); font-size:18px; font-weight:800; }
.scroll-wheel::before,.scroll-wheel::after { content:''; position:absolute; left:0; right:0; height:32px; pointer-events:none; z-index:2; }
.scroll-wheel::before { top:0; background:linear-gradient(180deg,var(--bg-base),transparent); opacity:0.7; }
.scroll-wheel::after { bottom:0; background:linear-gradient(0deg,var(--bg-base),transparent); opacity:0.7; }
.scroll-colon { font-size:22px; font-weight:700; color:var(--text-primary); }

.tab-nav { display:flex; gap:6px; margin-bottom:14px; padding:5px; background:var(--panel-bg); border-radius:14px; border:var(--glass-border); }
.tab-btn { flex:1; padding:10px 6px; border:none; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-secondary); background:transparent; }
.tab-btn.active { background:var(--card-bg); color:var(--accent-1); box-shadow:4px 4px 10px rgba(0,0,0,0.4); }

.section-card {
  position:relative; padding:18px; margin-bottom:14px;
  background:var(--panel-bg); border-radius:18px;
  backdrop-filter:blur(22px) saturate(1.35); -webkit-backdrop-filter:blur(22px) saturate(1.35);
  border:var(--glass-border);
  box-shadow:6px 6px 16px rgba(0,0,0,0.38);
}
[data-theme="light"] .section-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:48%;
  background:linear-gradient(180deg,rgba(255,255,255,0.45),rgba(255,255,255,0));
  border-radius:18px 18px 0 0; pointer-events:none; z-index:0;
}
.section-card > * { position:relative; z-index:1; }
.section-title { font-size:15px; font-weight:700; margin-bottom:14px; }

.chart-tabs { display:flex; gap:6px; margin-bottom:10px; }

'use strict';
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function formatTime(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return pad(h)+':'+pad(m)+':'+pad(ss);}
function pad(n){return n<10?'0'+n:''+n;}
function getToday(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function formatDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){if(e.name==='QuotaExceededError'||e.code===22){showToast('存储空间不足','error');}return false;}}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function showToast(msg,type){type=type||'info';var t=el('div','toast '+type,msg);$('toastContainer').appendChild(t);setTimeout(function(){t.remove();},2600);}
var audioCtx=null;

  var rtBtns=document.querySelectorAll('.review-tab');
  for(var r=0;r<rtBtns.length;r++){(function(btn){btn.onclick=function(){switchReviewType(btn.getAttribute('data-rt'));};})(rtBtns[r]);}
  $('reviewSave').onclick=saveReview;
  $('mascotInput').onchange=function(e){if(e.target.files&&e.target.files[0])uploadMascot(e.target.files[0]);e.target.value='';};
  $('detailToggle').onclick=function(){detailExpanded=!detailExpanded;renderDetailList();SOUND.click();};
  $('detailClear').onclick=function(){var selDate=getSelectedDateStr();var count=getRecordsForDate(selDate).length;if(!count){showToast('没有可清空的数据','info');return;}if(!confirm('确定清空 '+selDate+' 的记录吗？'))return;records=records.filter(function(r){return r.date!==selDate;});save('records',records);SOUND.success();showToast('已清空','success');renderAll();};
  $('iconPickerCancel').onclick=closeIconPicker;
  $('iconPickerCustom').onkeydown=function(e){if(e.key==='Enter'&&this.value.trim()){var customIcon=this.value.trim().slice(0,2);if(iconPickerContext==='category'){categoryIcons[iconPickerTarget]=customIcon;save('categoryIcons',categoryIcons);}closeIconPicker();renderCategories();renderAll();SOUND.click();}};
  setupLongPressEdit();
  initIndexedDB();
  renderAll();
  setInterval(updateTimer,30000);
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed', err));
    });
  }
</script>
